<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хэрэглэгчийн Бүртгэлийн Форм</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }

        header, footer {
            background-color: #2c3e50;
            color: #fff;
            text-align: center;
            padding: 1rem;
        }

        main {
            max-width: 600px;
            margin: 2rem auto;
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .inline-group {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .inline-group label {
            font-weight: normal;
            margin-bottom: 0;
        }

        button {
            background-color: #3498db;
            color: white;
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <!-- 1. Header (Хуудасны дээд хэсэг) -->
    <header>
        <h1>Вэб Сайтын Бүртгэл</h1>
    </header>

    <!-- 1. Main (Үндсэн агуулга) -->
    <main>
        <h2>Бүртгэлийн Форм</h2>
        <!-- 2. Форм -->
        <form action="#" method="POST">

            <!-- Input 1: Text (Овог нэр) -->
            <div class="form-group">
                <label for="fullname">Бүтэн нэр:</label>
                <input 
                    type="text" 
                    id="fullname" 
                    name="fullname" 
                    required 
                    placeholder="Доржийн Бат"
                >
            </div>

            <!-- Input 2: Email (Имэйл) -->
            <div class="form-group">
                <label for="email">Цахим цонх (Email):</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required 
                    placeholder="example@mail.com"
                >
            </div>

            <!-- Input 3: Password (Нууц үг - Pattern валидацитай) -->
            <div class="form-group">
                <label for="password">Нууц үг:</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required 
                    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                    title="Амжилттай бүртгүүлэхийн тулд ядаж 8 тэмдэгт, нэг том үсэг, нэг жижиг үсэг болон нэг тоо агуулсан байна."
                    placeholder="••••••••"
                >
            </div>

            <!-- Input 4: Date (Төрсөн огноо) -->
            <div class="form-group">
                <label for="dob">Төрсөн огноо:</label>
                <input 
                    type="date" 
                    id="dob" 
                    name="dob" 
                    required
                >
            </div>

            <!-- Input 5: Radio (Хүйс) -->
            <div class="form-group">
                <label>Хүйс:</label>
                <div class="inline-group">
                    <input type="radio" id="gender-male" name="gender" value="male" required>
                    <label for="gender-male">Эрэгтэй</label>

                    <input type="radio" id="gender-female" name="gender" value="female" required>
                    <label for="gender-female">Эмэгтэй</label>
                </div>
            </div>

            <!-- Input 6: Select (Ажиллаж буй салбар/Мэргэжил) -->
            <div class="form-group">
                <label for="occupation">Салбар/Мэргэжил:</label>
                <select id="occupation" name="occupation" required>
                    <option value="">-- Сонгоно уу --</option>
                    <option value="it">Мэдээллийн технологи</option>
                    <option value="business">Бизнес / Санхүү</option>
                    <option value="education">Боловсрол</option>
                    <option value="art">Урлаг / Дизайн</option>
                </select>
            </div>

            <!-- Input 7: Checkbox (Сонирхол) -->
            <div class="form-group">
                <label>Сонирхол:</label>
                <div class="inline-group">
                    <input type="checkbox" id="hobby-tech" name="hobbies" value="tech">
                    <label for="hobby-tech">Технологи</label>

                    <input type="checkbox" id="hobby-sports" name="hobbies" value="sports">
                    <label for="hobby-sports">Спорт</label>

                    <input type="checkbox" id="hobby-reading" name="hobbies" value="reading">
                    <label for="hobby-reading">Ном унших</label>
                </div>
            </div>

            <button type="submit">Бүртгүүлэх</button>
        </form>
    </main>

    <!-- 1. Footer (Хуудасны доод хэсэг) -->
    <footer>
        <p>&copy; 2026 Бүх эрх хуулиар хамгаалагдсан.</p>
    </footer>

</body>
</html>
